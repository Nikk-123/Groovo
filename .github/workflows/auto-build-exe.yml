name: Auto Build EXE and Release

permissions:
  contents: write

on:
  push:
    paths:
      - 'app.py'
      - 'static/**'
      - 'templates/**'
      - '.github/workflows/auto-build-exe.yml'

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git describe --tags

      - name: Verify project files exist at this commit
        # The paths filter above should guarantee this, but if the layout
        # was ever moved/renamed, every later step fails with an opaque
        # "directory name is invalid" OS error instead of a clear message.
        # Runs from the repo root (overriding the job's default
        # working-directory) since that default directory is exactly what
        # we're checking for — using it here would hit the same failure
        # this step exists to catch.
        working-directory: .
        run: |
          if [ ! -f "app.py" ] || [ ! -d "static" ] || [ ! -d "templates" ]; then
            echo "::error::Required project files/folders are missing at this commit. Contents of repo root:"
            ls -la
            exit 1
          fi
          echo "Found expected project layout:"
          ls -la
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found, installing explicit dependency list"
            pip install flask yt-dlp pymongo python-dotenv bcrypt
          fi
          pip install pyinstaller Pillow
          # pywebview: the native window shell. pythonnet: lets pywebview
          # drive the EdgeChromium (WebView2) backend on Windows instead of
          # falling back to the legacy MSHTML/IE engine.
          pip install pywebview pythonnet
        shell: bash

      - name: Create ICO from PNG (if needed)
        # Sets HAS_ICON=true so the build step can decide whether to pass --icon
        id: make_ico
        run: |
          python -c "from PIL import Image; Image.open('static/icon_new.png').save('static/icon.ico')"
          echo "HAS_ICON=true" >> $GITHUB_ENV
        shell: bash
        continue-on-error: true   # if Pillow fails, HAS_ICON stays unset → build skips --icon

      - name: Get latest tag and increment version with rollover
        id: versioning
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION_NUMBER=${LATEST_TAG#v}
          MAJOR=$(echo $VERSION_NUMBER | cut -d. -f1)
          MINOR=$(echo $VERSION_NUMBER | cut -d. -f2)
          PATCH=$(echo $VERSION_NUMBER | cut -d. -f3)

          # Increment patch; carry into minor/major when a component reaches 10
          # e.g. 0.0.9 -> 0.1.0,  0.9.9 -> 1.0.0
          NEW_PATCH=$((PATCH + 1))
          NEW_MINOR=$MINOR
          NEW_MAJOR=$MAJOR

          if [ $NEW_PATCH -ge 10 ]; then
            NEW_PATCH=0
            NEW_MINOR=$((MINOR + 1))
          fi

          if [ $NEW_MINOR -ge 10 ]; then
            NEW_MINOR=0
            NEW_MAJOR=$((MAJOR + 1))
          fi

          NEW_TAG="v$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
        shell: bash

      - name: Write .env from repo secrets
        # app.py hard-requires SECRET_KEY and MONGO_URI at import time and
        # raises RuntimeError if either is missing, so this .env must supply
        # real values. Always overwrite (rather than only creating it when
        # missing) so a stale/committed .env in the repo can never shadow
        # the real secrets. Add SECRET_KEY and MONGO_URI under Settings >
        # Secrets and variables > Actions in this repo.
        run: |
          if [ -z "${{ secrets.SECRET_KEY }}" ] || [ -z "${{ secrets.MONGO_URI }}" ]; then
            echo "::error::SECRET_KEY or MONGO_URI repo secret is not set."
            exit 1
          fi
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
        shell: bash

      - name: Build EXE with PyInstaller
        run: |
          # Use a bash array for the icon arg — expanding a plain string variable
          # unquoted ($ICON_FLAG) lets word-splitting corrupt paths and can embed
          # literal quote characters in the value passed to PyInstaller.
          EXTRA_DATA_ARGS=()
          if [ -d "modules" ]; then
            EXTRA_DATA_ARGS+=(--add-data "modules;modules")
          fi
          ICON_ARGS=()
          if [ "$HAS_ICON" = "true" ]; then
            ICON_ARGS=(--icon "static/icon.ico")
          fi
          pyinstaller --onefile --noconsole --clean \
            --add-data "templates;templates" \
            --add-data "static;static" \
            "${EXTRA_DATA_ARGS[@]}" \
            --add-data ".env;." \
            --hidden-import "webview.platforms.edgechromium" \
            --hidden-import "webview.platforms.winforms" \
            --collect-all "webview" \
            "${ICON_ARGS[@]}" \
            --name "groovo-${{ env.NEW_TAG }}" \
            app.py
        shell: bash

      # FIX: Push the tag BEFORE creating the release.
      # softprops/action-gh-release will also try to create the tag if it
      # doesn't exist yet — if we let it do that and THEN push the same tag,
      # git rejects the push with "tag already exists". Creating the tag first
      # means the release action simply finds and uses it.
      - name: Tag the commit and push tag
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          # Only push the tag if it doesn't already exist on remote.
          # This handles the case where the tag was created manually as a
          # baseline (e.g. after a versioning reset) — the release step
          # will simply find and reuse the existing tag.
          if git ls-remote --tags origin "refs/tags/${{ env.NEW_TAG }}" | grep -q .; then
            echo "Tag ${{ env.NEW_TAG }} already exists on remote — skipping push"
          else
            git tag ${{ env.NEW_TAG }}
            git push origin ${{ env.NEW_TAG }}
          fi
        shell: bash

      - name: Create GitHub Release and upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: Release ${{ env.NEW_TAG }}
          body: |
            Auto-built executable for version ${{ env.NEW_TAG }}

            Built from commit ${{ github.sha }}
          files: dist/groovo-${{ env.NEW_TAG }}.exe
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up PyInstaller temporary files
        if: always()
        run: |
          rm -rf build dist
          rm -f *.spec
        shell: bash